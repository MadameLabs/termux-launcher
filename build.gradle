buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22"
    }
}

ext {
    // Package name of the edition being built, shared by the app and termux-shared so the two can
    // never disagree. Unset, it builds the nix edition as always; TERMUX_APP_PACKAGE_NAME=com.termux
    // builds the same code to take the place of the stock Termux.
    termuxPackageName = System.getenv("TERMUX_APP_PACKAGE_NAME") ?: "com.termux.launcher.nix"
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:deprecation"
    }

    tasks.withType(Delete) {
        delete rootProject.buildDir
    }
}
